[package]
name = "fileflow"
version = "0.1.3"
edition = "2024"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
unicode-segmentation = "1.12"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
async-channel = "2"
notify = { version = "8", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61.2"

[build-dependencies]
winresource = "0.1"

# 崩溃定位用：release 默认不带调试信息，panic 堆栈只有地址没有函数名。
# 只给本项目的 crate 开 line-tables（依赖保持默认，避免全量重编）。
[profile.release]
debug = 1

[profile.release.package."*"]
debug = false
